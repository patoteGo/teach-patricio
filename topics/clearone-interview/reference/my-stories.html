<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-pt="Minhas histórias — preview" data-en="My stories — preview">
      My stories — preview
    </title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/dark.css" />
    <link rel="stylesheet" href="../assets/i18n.css" />
    <script src="../assets/i18n.js" defer></script>
    <script src="../assets/nav.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      #md-content {
        max-width: 820px;
        margin: 0 auto;
        padding: 0 0 120px;
        color: var(--ink);
        font-size: 1rem;
        line-height: 1.7;
      }
      #md-content h1 {
        font-family: "Space Grotesk";
        font-size: 1.8rem;
        margin: 40px 0 10px;
      }
      #md-content h2 {
        font-family: "Space Grotesk";
        font-size: 1.35rem;
        margin: 32px 0 8px;
        color: var(--violet);
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }
      #md-content h3 {
        font-family: "Space Grotesk";
        font-size: 1.12rem;
        margin: 20px 0 6px;
        color: var(--teal);
      }
      #md-content p {
        margin: 10px 0;
        color: var(--ink-soft);
      }
      #md-content strong {
        color: var(--ink);
      }
      #md-content em {
        color: var(--ink);
      }
      #md-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 14px 0;
        font-size: 0.86rem;
        display: block;
        overflow-x: auto;
      }
      #md-content th,
      #md-content td {
        padding: 8px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        white-space: normal;
      }
      #md-content th {
        background: var(--violet-50);
        font-family: "Space Grotesk";
        color: var(--ink);
      }
      #md-content td {
        color: var(--ink-soft);
      }
      #md-content blockquote {
        border-left: 4px solid var(--violet);
        padding: 8px 16px;
        margin: 12px 0;
        background: var(--violet-50);
        border-radius: 0 8px 8px 0;
        color: var(--ink);
      }
      #md-content code {
        font-family: "JetBrains Mono";
        background: var(--violet-50);
        color: var(--violet);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.86em;
      }
      #md-content ul,
      #md-content ol {
        margin: 8px 0;
        padding-left: 24px;
        color: var(--ink-soft);
      }
      #md-content li {
        margin: 4px 0;
      }
      #md-content hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      #md-fallback {
        text-align: center;
        padding: 60px 22px;
        color: var(--ink-soft);
      }
      #md-fallback b {
        color: var(--amber);
      }
    </style>
  </head>
  <body class="lang-pt">
    <article class="lesson">
      <header class="hero">
        <span class="eyebrow">📖 Reference · Live preview</span>
        <h1>My stories</h1>
        <p class="lead">
          Your behavioral story bank — BLUF + STAR + depth-reserve for every
          story. Rendered live from
          <code
            style="
              background: rgba(255, 255, 255, 0.18);
              padding: 1px 6px;
              border-radius: 5px;
            "
            >my-stories.md</code
          >.
        </p>
      </header>
      <div id="md-content"></div>
      <div id="md-fallback" style="display: none">
        <p>⚠️ <b>Can't load the file.</b></p>
        <p style="margin-top: 8px">
          This page fetches the markdown at runtime. Open it via
          <b>Live Server</b> (<code>http://127.0.0.1:5500</code>), not
          <code>file://</code>.
        </p>
      </div>
    </article>
    <script>
      (function () {
        const target = document.getElementById("md-content");
        const fallback = document.getElementById("md-fallback");
        fetch("../../behavioral-interview/my-stories.md")
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          })
          .then(function (md) {
            const html = marked.parse(md);
            const doc = new DOMParser().parseFromString(html, "text/html");
            target.replaceChildren.apply(
              target,
              Array.from(doc.body.childNodes),
            );
          })
          .catch(function () {
            target.style.display = "none";
            fallback.style.display = "block";
          });
      })();
    </script>
  </body>
</html>
